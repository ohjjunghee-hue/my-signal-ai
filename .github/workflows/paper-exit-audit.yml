name: Paper exit audit read-only tests
on:
  pull_request:
    paths:
      - 'paper_exit_audit_readonly.py'
      - 'test_paper_exit_audit_readonly.py'
      - 'backup_offline_verify.py'
      - 'test_backup_offline_verify.py'
      - 'test_backup_producer_integration.py'
      - 'test_backup_concurrent_writes.py'
      - '.github/workflows/paper-exit-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test sampled exit audit
        run: python -m unittest -v test_paper_exit_audit_readonly test_backup_offline_verify test_backup_producer_integration test_backup_concurrent_writes
