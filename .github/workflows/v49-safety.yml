name: V49 safety gate tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile server.py v49_gate.py test_v49_gate.py
      - run: python -m unittest -v test_v49_gate test_account_readonly
