
name: Bithumb Historical BUY Research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bithumb-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and evaluate Bithumb candles
        run: python research_engine.py --markets KRW-BTC KRW-ETH KRW-XRP --days 21 --horizon 1d --output research_results
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithumb-historical-research
          path: research_results/
          retention-days: 30

