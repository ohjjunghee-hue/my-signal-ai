name: Account read-only tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run isolated account tests
        run: |
          python -m py_compile account_readonly.py server.py test_account_readonly.py
          python -m unittest -v test_account_readonly
